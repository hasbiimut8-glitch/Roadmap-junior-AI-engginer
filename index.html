
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Engineer Learning Roadmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for better mobile UX */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-4 mb-6 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg border border-indigo-500/30">
                        <i class="fa-solid fa-brain text-xl"></i>
                    </span>
                    <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                        AI Engineer Roadmap
                    </h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">
                    Panduan belajar dari 0 hingga Siap Kerja • <span class="text-indigo-400 font-semibold">Hisam's Career Tracker</span>
                </p>
            </div>

            <!-- Progress Meter -->
            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 min-w-[240px]">
                <div class="flex justify-between items-center text-xs font-semibold mb-1.5">
                    <span class="text-slate-300">Total Progres Belajar</span>
                    <span id="overallPercentage" class="text-indigo-400 font-bold text-sm">0%</span>
                </div>
                <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
                    <div id="overallProgressBar" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-full w-0 transition-all duration-500 ease-out"></div>
                </div>
                <div class="flex justify-between text-[10px] text-slate-400 mt-1.5">
                    <span id="completedCount">0/0 Topik Selesai</span>
                    <button onclick="resetProgress()" class="text-rose-400 hover:text-rose-300 transition-colors">
                        <i class="fa-solid fa-rotate-left mr-1"></i>Reset
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">

        <!-- Controls: Search & Category Filter -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterTopics()" placeholder="Cari topik (misal: Python, API, RAG, Git)..." 
                    class="w-full bg-slate-800/90 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-all">
            </div>
            <select id="phaseFilter" onchange="filterTopics()" 
                class="bg-slate-800/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
                <option value="all">Semua Fase (1 - 6)</option>
                <option value="fase1">Fase 1: Dasar Python</option>
                <option value="fase2">Fase 2: Data & Statistik</option>
                <option value="fase3">Fase 3: AI API & Backend</option>
                <option value="fase4">Fase 4: Machine Learning</option>
                <option value="fase5">Fase 5: RAG & Vector DB</option>
                <option value="fase6">Fase 6: Portofolio & Karir</option>
            </select>
        </div>

        <!-- Roadmap Phases Container -->
        <div id="roadmapContainer" class="space-y-6">
            <!-- Roadmap items will be rendered dynamically via JavaScript -->
        </div>

    </main>

    <footer class="max-w-4xl mx-auto px-4 mt-12 text-center text-xs text-slate-500">
        <p>💡 Tip: Konsistensi 1-2 jam tiap malam lebih ampuh daripada 8 jam cuma sehari. Tetap semangat, Hisam!</p>
        <p class="mt-1">Dibuat khusus untuk perjalanan karir AI Engineer.</p>
    </footer>

    <script>
        /* Roadmap Data Definition */
        const roadmapData = [
            {
                id: "fase1",
                title: "Fase 1: Dasar Pemrograman Python & Logika",
                timeframe: "Bulan 1 - 2",
                icon: "fa-brands fa-python",
                description: "Menguasai bahasa pemrograman nomor satu di dunia AI dari nol.",
                topics: [
                    { id: "p1_1", text: "Variabel, Tipe Data (String, Integer, Float, Boolean) & Operator Math" },
                    { id: "p1_2", text: "Kondisional (if, elif, else) & Logika Pembuat Keputusan" },
                    { id: "p1_3", text: "Perulangan / Looping (for loop, while loop, break, continue)" },
                    { id: "p1_4", text: "Struktur Data Koleksi: List, Tuple, Set, dan Dictionary" },
                    { id: "p1_5", text: "Pembuatan Fungsi (def, parameter, return value, lambda)" },
                    { id: "p1_6", text: "Handling Input & File (Baca/Tulis file .txt dan .json)" },
                    { id: "p1_7", text: "Object-Oriented Programming (OOP) Dasar: Class, Instance, & Method" },
                    { id: "p1_8", text: "Algoritma Dasar & Problem Solving Sederhana" }
                ]
            },
            {
                id: "fase2",
                title: "Fase 2: Pengolahan Data & Statistik Dasar",
                timeframe: "Bulan 3 - 4",
                icon: "fa-solid fa-chart-pie",
                description: "AI butuh data. Kamu harus bisa mengolah dan menganalisis data angka/teks.",
                topics: [
                    { id: "p2_1", text: "NumPy: Manipulasi Matrix, Array, dan Komputasi Angka" },
                    { id: "p2_2", text: "Pandas: Membaca Dataset (.csv, .xlsx) & Dataframe Handling" },
                    { id: "p2_3", text: "Data Cleaning: Mengatasi data kosong (Null/NaN) & Duplikat" },
                    { id: "p2_4", text: "Visualisasi Data: Grafik dengan Matplotlib & Seaborn" },
                    { id: "p2_5", text: "Statistik Dasar AI: Mean, Median, Mode, Variance, & Standar Deviasi" },
                    { id: "p2_6", text: "Probabilitas Dasar & Distribusi Data" }
                ]
            },
            {
                id: "fase3",
                title: "Fase 3: AI Integration, Prompting & Backend API",
                timeframe: "Bulan 5 - 7",
                icon: "fa-solid fa-plug",
                description: "Menghubungkan model AI terkenal (Gemini / OpenAI) ke aplikasi buatanmu.",
                topics: [
                    { id: "p3_1", text: "Konsep Dasar Web API: HTTP Request (GET, POST), Header, & JSON Payload" },
                    { id: "p3_2", text: "Integrasi Gemini API / OpenAI API menggunakan Python" },
                    { id: "p3_3", text: "Prompt Engineering Advanced: System Prompt, Few-Shot, & Structured Output" },
                    { id: "p3_4", text: "Backend Development Sederhana pakai FastAPI / Flask" },
                    { id: "p3_5", text: "Menghubungkan Frontend Web (HTML/JS) dengan Backend AI Python" },
                    { id: "p3_6", text: "Project #1: Membangun Web Chatbot AI Asisten Pribadi" }
                ]
            },
            {
                id: "fase4",
                title: "Fase 4: Machine Learning & Deep Learning Basics",
                timeframe: "Bulan 8 - 12",
                icon: "fa-solid fa-network-wired",
                description: "Memahami bagaimana AI 'belajar' dari data secara mandiri.",
                topics: [
                    { id: "p4_1", text: "Supervised Learning: Regresi (Prediksi Angka) pakai Scikit-Learn" },
                    { id: "p4_2", text: "Supervised Learning: Klasifikasi (Kategori) & Decision Tree" },
                    { id: "p4_3", text: "Unsupervised Learning: Clustering data pakai K-Means" },
                    { id: "p4_4", text: "Evaluasi Model AI: Measuring Accuracy, Precision, Recall, & F1-Score" },
                    { id: "p4_5", text: "Deep Learning Intro: Konsep Neural Network & Perceptron" },
                    { id: "p4_6", text: "Pengenalan Framework PyTorch / TensorFlow" }
                ]
            },
            {
                id: "fase5",
                title: "Fase 5: Modern AI Engineering (RAG & Vector DB)",
                timeframe: "Bulan 13 - 16",
                icon: "fa-solid fa-database",
                description: "Teknologi AI paling dicari perusahaan: Bikin AI yang paham dokumen/perusahaan.",
                topics: [
                    { id: "p5_1", text: "Text Embeddings: Mengubah Teks Tulisan menjadi Vector Angka" },
                    { id: "p5_2", text: "Vector Database: Menyimpan data vector di ChromaDB / Pinecone" },
                    { id: "p5_3", text: "RAG Architecture: Membangun sistem AI pencari dokumen PDF" },
                    { id: "p5_4", text: "Framework AI Modern: Menggunakan LangChain atau LlamaIndex" },
                    { id: "p5_5", text: "Project #2: Web AI yang bisa membaca dan merangkum PDF Dokumentasi" }
                ]
            },
            {
                id: "fase6",
                title: "Fase 6: Deployment, Git & Portofolio Siap Kerja",
                timeframe: "Bulan 17 - 20",
                icon: "fa-solid fa-briefcase",
                description: "Mempublikasikan hasil karya ke internet dan siap melamar ke perusahaan.",
                topics: [
                    { id: "p6_1", text: "Git & GitHub: Manajemen Versi Kode & Membuat Portofolio Online" },
                    { id: "p6_2", text: "Deployment Aplikasi AI ke Cloud Gratis (Render, Vercel, HuggingFace)" },
                    { id: "p6_3", text: "Dokumentasi Project: Menulis README.md Profesional untuk Recruiter" },
                    { id: "p6_4", text: "Persiapan Interview Teknis & Latihan Coding Test" },
                    { id: "p6_5", text: "Project #3 Utama: Aplikasi AI End-to-End Siap Pakai" },
                    { id: "p6_6", text: "Penyusunan CV / Resume Khusus AI Engineer & Melamar Kerja" }
                ]
            }
        ];

        /* LocalStorage State Management */
        const STORAGE_KEY = "hisam_ai_roadmap_state";
        let userProgress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        /* Save to LocalStorage */
        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress));
            updateStats();
        }

        /* Toggle Checkbox State */
        function toggleTopic(topicId) {
            userProgress[topicId] = !userProgress[topicId];
            saveProgress();
            
            // Visual Update for styling
            const label = document.getElementById(`label_${topicId}`);
            if (label) {
                if (userProgress[topicId]) {
                    label.classList.add("line-through", "text-slate-500");
                    label.classList.remove("text-slate-200");
                } else {
                    label.classList.remove("line-through", "text-slate-500");
                    label.classList.add("text-slate-200");
                }
            }
        }

        /* Render Roadmap to HTML */
        function renderRoadmap() {
            const container = document.getElementById("roadmapContainer");
            container.innerHTML = "";

            roadmapData.forEach((phase, index) => {
                const phaseCard = document.createElement("div");
                phaseCard.className = "phase-card bg-slate-800/60 border border-slate-700/70 rounded-2xl p-5 shadow-sm transition-all hover:border-slate-600";
                phaseCard.dataset.phaseId = phase.id;

                let topicsHTML = "";
                phase.topics.forEach((topic) => {
                    const isChecked = !!userProgress[topic.id];
                    topicsHTML += `
                        <label class="flex items-start gap-3 p-2.5 rounded-xl hover:bg-slate-700/40 cursor-pointer transition-colors group">
                            <input type="checkbox" 
                                id="check_${topic.id}"
                                ${isChecked ? "checked" : ""} 
                                onchange="toggleTopic('${topic.id}')"
                                class="mt-0.5 w-4 h-4 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 bg-slate-700">
                            <span id="label_${topic.id}" class="text-sm ${isChecked ? "line-through text-slate-500" : "text-slate-200"} transition-all group-hover:text-indigo-300">
                                ${topic.text}
                            </span>
                        </label>
                    `;
                });

                phaseCard.innerHTML = `
                    <div class="flex items-start justify-between gap-3 border-b border-slate-700/60 pb-3 mb-4">
                        <div class="flex items-center gap-3">
                            <span class="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl border border-indigo-500/20">
                                <i class="${phase.icon} text-lg"></i>
                            </span>
                            <div>
                                <h2 class="font-bold text-base md:text-lg text-slate-100">${phase.title}</h2>
                                <p class="text-xs text-slate-400 mt-0.5">${phase.description}</p>
                            </div>
                        </div>
                        <span class="text-[11px] font-semibold bg-slate-700/80 text-indigo-300 px-2.5 py-1 rounded-full whitespace-nowrap">
                            ${phase.timeframe}
                        </span>
                    </div>

                    <!-- Topics Checklist -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-1 mb-4">
                        ${topicsHTML}
                    </div>

                    <!-- Personal Phase Notes -->
                    <div class="pt-3 border-t border-slate-700/40">
                        <textarea 
                            id="note_${phase.id}"
                            onchange="saveNote('${phase.id}')"
                            placeholder="Catatan pribadi / Target tanggal selesai fase ini..."
                            class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl p-2.5 text-xs text-slate-300 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all resize-none h-16">${userProgress[`note_${phase.id}`] || ''}</textarea>
                    </div>
                `;

                container.appendChild(phaseCard);
            });

            updateStats();
        }

        /* Save Phase Personal Notes */
        function saveNote(phaseId) {
            const noteText = document.getElementById(`note_${phaseId}`).value;
            userProgress[`note_${phaseId}`] = noteText;
            saveProgress();
        }

        /* Calculate and Update Overall Stats */
        function updateStats() {
            let totalTopics = 0;
            let completedTopics = 0;

            roadmapData.forEach(phase => {
                phase.topics.forEach(topic => {
                    totalTopics++;
                    if (userProgress[topic.id]) {
                        completedTopics++;
                    }
                });
            });

            const percentage = totalTopics === 0 ? 0 : Math.round((completedTopics / totalTopics) * 100);

            document.getElementById("overallPercentage").textContent = `${percentage}%`;
            document.getElementById("overallProgressBar").style.width = `${percentage}%`;
            document.getElementById("completedCount").textContent = `${completedTopics}/${totalTopics} Topik Selesai`;
        }

        /* Search & Filter Functionality */
        function filterTopics() {
            const searchQuery = document.getElementById("searchInput").value.toLowerCase();
            const selectedPhase = document.getElementById("phaseFilter").value;

            document.querySelectorAll(".phase-card").forEach(card => {
                const phaseId = card.dataset.phaseId;
                const matchesPhase = selectedPhase === "all" || selectedPhase === phaseId;
                const cardText = card.innerText.toLowerCase();
                const matchesSearch = cardText.includes(searchQuery);

                if (matchesPhase && matchesSearch) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        /* Reset Progress Option */
        function resetProgress() {
            if (confirm("Apakah kamu yakin ingin mereset semua progres belajar?")) {
                userProgress = {};
                saveProgress();
                renderRoadmap();
            }
        }

        /* Initialize App on Load */
        window.onload = function() {
            renderRoadmap();
        };
    </script>
</body>
</html>
